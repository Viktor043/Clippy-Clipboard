repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: protect-main-branch
        name: Prevent direct push to main
        entry: .githooks/protect-main.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: audit-log-commit
        name: Log commit to agent audit
        entry: .githooks/audit-commit.sh
        language: script
        stages: [post-commit]
        always_run: true
        pass_filenames: false
